<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Creates the neon glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background to match your site's theme (optional) -->
  <rect width="64" height="64" rx="16" fill="#0a0a0a" />
  
  <!-- Shield Outline -->
  <path d="M32 10 L16 16 V32 C16 44 23 52 32 54 C41 52 48 44 48 32 V16 Z" 
        fill="none" 
        stroke="#FFEA00" 
        stroke-width="3.5" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
        
  <!-- Checkmark Inside -->
  <path d="M24 32 L29 37 L40 24" 
        fill="none" 
        stroke="#FFEA00" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />
</svg>
